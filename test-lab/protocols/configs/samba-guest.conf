[global]
   server role = standalone server
   security = user
   map to guest = Bad User
   server min protocol = SMB2
   server max protocol = SMB3
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log file = /dev/stdout
   logging = file

[GuestMedia]
   path = /shared
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
